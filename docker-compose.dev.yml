version: "3.9"

networks:
  xprnt-network:
    driver: bridge

volumes:
  postgres_order_data:
  postgres_design_data:
  minio_data:
  redis_data:

services:
  order-service:
    build: ./services/order-service
    ports:
      - "8000:8000"
    env_file: .env.dev
    depends_on:
      postgres-order:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xprnt-network
    restart: unless-stopped

  design-service:
    build: ./services/design-service
    ports:
      - "8001:8000"
    env_file: .env.dev
    depends_on:
      postgres-design:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xprnt-network
    restart: unless-stopped

  sync-service-vps:
    build: ./services/sync-service
    ports:
      - "8002:8000"
    env_file: .env.dev
    environment:
      - ROLE=vps
    networks:
      - xprnt-network
    restart: unless-stopped

  sync-service-office:
    build: ./services/sync-service
    ports:
      - "8003:8002"
    env_file: .env.dev
    environment:
      - ROLE=office
    networks:
      - xprnt-network
    restart: unless-stopped

  postgres-order:
    image: postgres:16
    ports:
      - "5432:5432"
    env_file: .env.dev
    environment:
      - POSTGRES_DB=order_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - xprnt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-design:
    image: postgres:16
    ports:
      - "5433:5432"
    env_file: .env.dev
    environment:
      - POSTGRES_DB=design_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_design_data:/var/lib/postgresql/data
    networks:
      - xprnt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d design_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file: .env.dev
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - xprnt-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - xprnt-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    env_file: .env.dev
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@xprnt.dev
      - PGADMIN_DEFAULT_PASSWORD=admin
    networks:
      - xprnt-network
    depends_on:
      - postgres-order
      - postgres-design
    restart: unless-stopped

  admin:
    build:
      context: ./services/admin
      dockerfile: Dockerfile.dev
    container_name: xprnt-admin
    ports:
      - "3001:3001"
    volumes:
      - ./services/admin/src:/app/src
      - ./services/admin/public:/app/public
      - ./services/admin/index.html:/app/index.html
      - ./services/admin/vite.config.js:/app/vite.config.js
    environment:
      - VITE_API_TARGET=http://order-service:8000
    depends_on:
      - order-service
    networks:
      - xprnt-network
    restart: unless-stopped
