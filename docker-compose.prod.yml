version: "3.9"

networks:
  xprnt-network:
    driver: bridge

volumes:
  postgres_order_data:
  postgres_design_data:
  minio_data:
  redis_data:

services:
  order-service:
    build: ./services/order-service
    ports:
      - "8000:8000"
    env_file: .env.prod
    depends_on:
      postgres-order:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xprnt-network
    restart: always

  design-service:
    build: ./services/design-service
    ports:
      - "8001:8001"
    env_file: .env.prod
    depends_on:
      postgres-design:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xprnt-network
    restart: always

  sync-service-vps:
    build: ./services/sync-service
    ports:
      - "8002:8002"
    env_file: .env.prod
    environment:
      - ROLE=vps
    networks:
      - xprnt-network
    restart: always

  sync-service-office:
    build: ./services/sync-service
    ports:
      - "8003:8002"
    env_file: .env.prod
    environment:
      - ROLE=office
    networks:
      - xprnt-network
    restart: always

  postgres-order:
    image: postgres:16
    env_file: .env.prod
    environment:
      - POSTGRES_DB=order_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${ORDER_DB_PASSWORD}
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    networks:
      - xprnt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  postgres-design:
    image: postgres:16
    env_file: .env.prod
    environment:
      - POSTGRES_DB=design_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DESIGN_DB_PASSWORD}
    volumes:
      - postgres_design_data:/var/lib/postgresql/data
    networks:
      - xprnt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d design_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  minio:
    image: minio/minio:latest
    env_file: .env.prod
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - xprnt-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - xprnt-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
