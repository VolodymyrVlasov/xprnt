version: "3.9"

networks:
  xprnt-network:
    driver: bridge

volumes:
  postgres_order_data:
  postgres_design_data:
  minio_data:
  redis_data:

services:
  order-service:
    build: ./services/order-service
    container_name: order-service
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env.prod
    depends_on:
      postgres-order:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xprnt-network
    restart: always

  design-service:
    build: ./services/design-service
    container_name: design-service
    ports:
      - "127.0.0.1:8001:8000"
    env_file: .env.prod
    depends_on:
      postgres-design:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xprnt-network
    restart: always

  sync-service-office:
    build: ./services/sync-service
    container_name: sync-service-office
    ports:
      - "127.0.0.1:8002:8000"
    env_file: .env.prod
    environment:
      - ROLE=office
    networks:
      - xprnt-network
    restart: always

  postgres-order:
    image: postgres:16
    container_name: postgres-order
    env_file: .env.prod
    environment:
      - POSTGRES_DB=order_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - xprnt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  postgres-design:
    image: postgres:16
    container_name: postgres-design
    env_file: .env.prod
    environment:
      - POSTGRES_DB=design_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_design_data:/var/lib/postgresql/data
    networks:
      - xprnt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d design_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "127.0.0.1:9000:9000"
    env_file: .env.prod
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - xprnt-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    networks:
      - xprnt-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  admin:
    build:
      context: ./services/admin
      dockerfile: Dockerfile.dev
    container_name: xprnt-admin
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - VITE_API_TARGET=http://order-service:8000
    depends_on:
      - order-service
    networks:
      - xprnt-network
    restart: always
