name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-order-service:
    name: Test order-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/order-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: services/order-service
        run: pytest tests/ -v

  test-design-service:
    name: Test design-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/design-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: services/design-service
        run: pytest tests/ -v

  test-sync-service:
    name: Test sync-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/sync-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: services/sync-service
        run: pytest tests/ -v

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [test-order-service, test-design-service, test-sync-service]
    steps:
      - uses: actions/checkout@v4

      - name: Build order-service
        run: docker build -t xprnt-order-service ./services/order-service

      - name: Build design-service
        run: docker build -t xprnt-design-service ./services/design-service

      - name: Build sync-service
        run: docker build -t xprnt-sync-service ./services/sync-service
